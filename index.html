<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Negocios Internacionales – 2do Parcial</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#fff; --text:#1c2333; --muted:#5b6478; --border:#dfe4ee;
    --primary:#3b5bdb; --primary-soft:#e7ecff;
    --ok:#1f9d55; --ok-bg:#e6f6ec; --bad:#d64545; --bad-bg:#fdeaea;
    --shadow:0 2px 10px rgba(20,30,60,.07);
    --warn:#8a6100; --warn-bg:#fff5da; --warn-bd:#e8c765;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#10141f; --card:#1a2030; --text:#e8ecf5; --muted:#9aa4bb; --border:#2b3350;
      --primary:#7b93ff; --primary-soft:#232b4a;
      --ok:#4cc38a; --ok-bg:#15301f; --bad:#ff7b7b; --bad-bg:#3a1c1f;
      --shadow:none;
      --warn:#e9c46a; --warn-bg:#3a2e10; --warn-bd:#6b5518;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
  header{padding:28px 16px 8px;text-align:center}
  header h1{margin:0;font-size:clamp(1.3rem,4vw,1.9rem)}
  header p{margin:4px 0 0;color:var(--muted);font-size:.95rem}
  main{max-width:820px;margin:0 auto;padding:0 16px 48px}

  .menu{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;
    margin:16px 0;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
  .frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .flabel{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
    font-weight:700;flex:0 0 74px}
  .fbtn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:7px 14px;
    border-radius:999px;font:inherit;font-size:.9rem;font-weight:600;cursor:pointer;transition:.15s}
  .fbtn:hover{border-color:var(--primary)}
  .fbtn.active{background:var(--primary);border-color:var(--primary);color:#fff}
  .fbtn small{opacity:.75;font-weight:500;margin-left:4px}
  .exambtn{width:100%;border:2px solid var(--primary);background:var(--primary-soft);color:var(--primary);
    padding:12px 16px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer;transition:.15s}
  .exambtn:hover{background:var(--primary);color:#fff}
  .exambtn.active{background:var(--primary);color:#fff}
  .menu.locked .practice{opacity:.45}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
  .score{font-weight:600;color:var(--muted)}
  .score b{color:var(--text)}
  .actions{display:flex;gap:8px}
  .btn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:8px 14px;
    border-radius:8px;font:inherit;cursor:pointer}
  .btn:hover{border-color:var(--primary);color:var(--primary)}
  .btn.main{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
  .btn.main:hover{color:#fff;opacity:.9}
  .scope{font-size:.85rem;color:var(--muted);margin:0 0 10px}
  .bar{height:6px;background:var(--border);border-radius:9px;overflow:hidden;margin-bottom:18px}
  .bar i{display:block;height:100%;width:0;background:var(--primary);transition:width .3s}

  .block-title{margin:26px 0 10px;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--primary);font-weight:700}
  .q{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
  .q h3{margin:0 0 4px;font-size:1.02rem}
  .tag{display:inline-block;font-size:.72rem;background:var(--primary-soft);color:var(--primary);
    padding:2px 9px;border-radius:999px;margin-bottom:8px;font-weight:600}
  .opts{display:grid;gap:10px;margin-top:12px}
  .opt{display:flex;gap:12px;text-align:left;width:100%;border:2px solid var(--border);background:transparent;
    color:var(--text);padding:12px 14px;border-radius:10px;font:inherit;cursor:pointer;transition:.15s}
  .opt:hover:not(:disabled){border-color:var(--primary);background:var(--primary-soft)}
  .opt .l{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--primary-soft);color:var(--primary);
    display:grid;place-items:center;font-weight:700;font-size:.85rem}
  .opt:disabled{cursor:default}
  .opt.sel{border-color:var(--primary);background:var(--primary-soft)}
  .opt.correct{border-color:var(--ok);background:var(--ok-bg)}
  .opt.correct .l{background:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .opt.wrong .l{background:var(--bad);color:#fff}
  .opt.dim{opacity:.85}
  .opt .txt{display:block}
  .optwhy{display:block;margin-top:5px;font-size:.86rem;color:var(--muted)}
  .just .src{display:block;margin-top:8px;font-size:.78rem;color:var(--muted)}
  .exam{display:inline-block;font-size:.72rem;font-weight:700;line-height:1.35;
    padding:3px 10px;border-radius:999px;margin:0 0 8px 6px;
    background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-bd)}
  .just{margin-top:14px;padding:12px 14px;border-radius:10px;border-left:4px solid var(--ok);background:var(--ok-bg);font-size:.95rem}
  .just.bad{border-color:var(--bad);background:var(--bad-bg)}
  .just strong{display:block;margin-bottom:2px}
  .result{display:none;text-align:center;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;box-shadow:var(--shadow)}
  .result.show{display:block}
  .result h2{margin:0 0 6px}
  .empty{text-align:center;color:var(--muted);padding:40px 0}
  .finish{text-align:center;margin:8px 0 24px}
</style>
</head>
<body>
<header>
  <h1>Negocios Internacionales</h1>
  <p>2do parcial · práctica de preguntas multiple choice</p>
</header>
<main>
  <div class="menu" id="menu"></div>
  <div class="toolbar">
    <div class="score">Respondidas <b id="answered">0</b>/<b id="total">0</b> · Correctas <b id="right">0</b></div>
    <div class="actions"><button class="btn" id="reset">Reiniciar</button></div>
  </div>
  <div class="scope" id="scope"></div>
  <div class="bar"><i id="progress"></i></div>
  <div id="list"></div>
  <div class="finish" id="finish"></div>
  <div class="result" id="result"></div>
</main>

<script>
/* ============ DATOS ============
   Las unidades se arman solas a partir del campo `unidad` de cada pregunta. */
const UNITS = [];
document.querySelectorAll("script.preguntas").forEach(el => {
  JSON.parse(el.textContent).forEach(q => {
    let u = UNITS.find(u => u.n === q.unidad);
    if (!u) UNITS.push(u = { n:q.unidad, id:"u"+q.unidad, name:"Unidad "+q.unidad, questions:[] });
    u.questions.push(q);
  });
});
UNITS.sort((a,b) => a.n - b.n);

/* ============ LÓGICA ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const ALL = "all";
const LEVELS = [
  ["sencillo",   "Fácil"],
  ["intermedio", "Medio"],
  ["dificil",    "Difícil"],
  ["parcial",    "Parcial"]
];
const LEVEL_NAME = Object.fromEntries(LEVELS);

let mode = "practice";        // "practice" | "exam"
let unitSel = UNITS[0].id;    // id de unidad o ALL
let levelSel = "sencillo";
let state = {};               // por alcance: { answers:{id:letra}, finished:bool }

/* ---- alcance actual ---- */
function scopeKey(){ return mode === "exam" ? "exam" : unitSel + "|" + levelSel; }
function ensure(){ const k = scopeKey(); if(!state[k]) state[k] = { answers:{}, finished:false }; return state[k]; }

function itemsFor(unitId, level){
  const out = [];
  UNITS.filter(u => unitId === ALL || u.id === unitId).forEach(u =>
    u.questions.forEach(q => { if (q.nivel === level) out.push({...q, unit:u.name}); }));
  return out;
}
function items(){
  return mode === "exam" ? itemsFor(ALL, "parcial") : itemsFor(unitSel, levelSel);
}
function count(unitId, level){ return itemsFor(unitId, level).length; }

function scopeLabel(){
  if (mode === "exam") return "Parcial completo · todas las unidades";
  const u = unitSel === ALL ? "Todas las unidades" : UNITS.find(u => u.id === unitSel).name;
  return u + " · " + LEVEL_NAME[levelSel];
}

/* ---- menú ---- */
function renderMenu(){
  const box = $("menu");
  box.innerHTML = "";
  box.className = "menu" + (mode === "exam" ? " locked" : "");

  const row = (label, opts, active, pick) => {
    const r = document.createElement("div");
    r.className = "frow practice";
    const s = document.createElement("span");
    s.className = "flabel"; s.textContent = label;
    r.appendChild(s);
    opts.forEach(([id, name, n]) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "fbtn" + (mode === "practice" && id === active ? " active" : "");
      b.innerHTML = name + (n != null ? `<small>${n}</small>` : "");
      b.onclick = () => { mode = "practice"; pick(id); renderMenu(); render(); window.scrollTo({top:0,behavior:"smooth"}); };
      r.appendChild(b);
    });
    box.appendChild(r);
  };

  const unitOpts = UNITS.map(u => [u.id, u.name, null]);
  if (UNITS.length > 1) unitOpts.push([ALL, "Todas", null]);
  row("Unidad", unitOpts, unitSel, id => { unitSel = id; });
  row("Nivel", LEVELS.map(([id, name]) => [id, name, count(unitSel, id)]), levelSel, id => { levelSel = id; });

  const eb = document.createElement("button");
  eb.type = "button";
  eb.className = "exambtn" + (mode === "exam" ? " active" : "");
  eb.textContent = `📝 Parcial completo — ${count(ALL, "parcial")} preguntas, todas las unidades, un solo intento`;
  eb.onclick = () => { mode = "exam"; renderMenu(); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  box.appendChild(eb);
}

/* ---- tarjetas ---- */
function render(){
  const s = ensure(), list = $("list"), its = items(), n = its.length;
  const exam = mode === "exam";
  list.innerHTML = "";
  $("result").className = "result";
  $("finish").innerHTML = "";

  if (!n){
    list.innerHTML = '<div class="empty">Todavía no hay preguntas en esta sección.</div>';
    updateStats(); return;
  }

  let lastBlock = null;
  its.forEach((it, i) => {
    if (exam && it.unit !== lastBlock){
      lastBlock = it.unit;
      const h = document.createElement("div");
      h.className = "block-title"; h.textContent = it.unit;
      list.appendChild(h);
    }
    const card = document.createElement("section");
    card.className = "q";
    const tag = exam ? `${it.unit} · Pregunta ${i+1} de ${n}` : `Pregunta ${i+1} de ${n} (${LEVEL_NAME[it.nivel]})`;
    card.innerHTML = `<span class="tag">${tag}</span>${originBadge(it)}<h3>${i+1}. ${esc(it.pregunta)}</h3><div class="opts"></div>`;
    const ob = card.querySelector(".opts");
    Object.entries(it.opciones).forEach(([k, txt]) => {
      const b = document.createElement("button");
      b.className = "opt"; b.type = "button"; b.dataset.k = k;
      b.innerHTML = `<span class="l">${k}</span><span class="txt">${esc(txt)}</span>`;
      b.onclick = () => answer(it.id, k);
      ob.appendChild(b);
    });
    list.appendChild(card);
    const a = s.answers[it.id];
    if (exam){
      if (s.finished) paint(card, it, a);
      else if (a !== undefined) card.querySelector(`.opt[data-k="${a}"]`).classList.add("sel");
    } else if (a !== undefined) paint(card, it, a);
  });
  updateStats();
}

function originBadge(it){
  if (!it.origen_parcial) return "";
  const adaptadas = it.opciones_originales === false ? " · opciones adaptadas" : "";
  return `<span class="exam">📌 ${esc(it.origen_parcial)}${adaptadas}</span>`;
}

function paint(card, it, choice){
  card.querySelectorAll(".opt").forEach(b => {
    const k = b.dataset.k;
    b.disabled = true;
    b.classList.remove("sel");
    if (k === it.correcta) b.classList.add("correct");
    else if (k === choice) b.classList.add("wrong");
    else b.classList.add("dim");
    const why = document.createElement("span");
    why.className = "optwhy"; why.textContent = it.justificacion_opciones[k];
    b.querySelector(".txt").appendChild(why);
  });
  const ok = choice === it.correcta;
  const head = choice === undefined ? `⚪ Sin responder — la respuesta correcta es la ${it.correcta})`
             : ok ? "✅ ¡Correcto!"
             : `❌ Incorrecto — la respuesta correcta es la ${it.correcta})`;
  const d = document.createElement("div");
  d.className = "just" + (ok ? "" : " bad");
  d.innerHTML = `<strong>${head}</strong>${esc(it.explicacion)}<span class="src">Fuente: ${esc(it.fuente)}</span>`;
  card.appendChild(d);
}

function answer(id, k){
  const s = ensure(), its = items(), i = its.findIndex(it => it.id === id);
  if (i < 0 || s.finished) return;
  const card = $("list").querySelectorAll(".q")[i];
  if (mode === "exam"){
    s.answers[id] = k;                          // en el parcial se puede cambiar hasta finalizar
    card.querySelectorAll(".opt").forEach(b => b.classList.toggle("sel", b.dataset.k === k));
  } else {
    if (s.answers[id] !== undefined) return;
    s.answers[id] = k;
    paint(card, its[i], k);
  }
  updateStats();
}

function finishExam(){
  const s = ensure(), its = items();
  const pend = its.filter(it => s.answers[it.id] === undefined).length;
  if (pend && !confirm(`Te quedan ${pend} sin responder. ¿Finalizar igual?`)) return;
  s.finished = true;
  render();
  $("result").scrollIntoView({behavior:"smooth", block:"center"});
}

function updateStats(){
  const s = ensure(), its = items(), total = its.length;
  const exam = mode === "exam";
  let done = 0, right = 0;
  its.forEach(it => {
    const a = s.answers[it.id];
    if (a !== undefined){ done++; if (a === it.correcta) right++; }
  });
  $("total").textContent = total;
  $("answered").textContent = done;
  $("right").textContent = exam && !s.finished ? "–" : right;
  $("progress").style.width = total ? (done/total*100)+"%" : "0";
  $("scope").textContent = `Mostrando ${total} pregunta${total===1?"":"s"} · ${scopeLabel()}`;

  const r = $("result"), f = $("finish");
  f.innerHTML = "";
  r.className = "result";
  if (!total) return;

  if (exam && !s.finished){
    const b = document.createElement("button");
    b.className = "btn main"; b.type = "button";
    b.textContent = `Finalizar parcial (${done}/${total} respondidas)`;
    b.onclick = finishExam;
    f.appendChild(b);
    return;
  }
  if (exam ? s.finished : done === total){
    const pct = Math.round(right/total*100);
    r.innerHTML = `<h2>${pct >= 60 ? "🎉" : "💪"} Resultado: ${right}/${total} (${pct}%)</h2><p>${scopeLabel()} — ${pct>=60 ? "¡Buen trabajo!" : "Repasá las justificaciones e intentá de nuevo."}</p>`;
    r.className = "result show";
  }
}

$("reset").onclick = () => { delete state[scopeKey()]; render(); window.scrollTo({top:0,behavior:"smooth"}); };

renderMenu(); render();
</script>
</body>
</html>
